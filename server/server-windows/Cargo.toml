[package]
name = "server-windows"
# Single source of truth for the server's version: winresource embeds it in
# the exe's VERSIONINFO (build.rs) and installer/build-installer.ps1 reads it
# for the setup filename and Inno's AppVersion. Bumped off the 0.1.0 scaffold
# default to match the shipped release line (quick 260729-38z).
version = "1.7.1"
edition.workspace = true
rust-version.workspace = true
description = "Windows composition root for Remote Control: enigo input injection, DPI awareness, tracing subscriber, ServerDeps assembly around server-core."

[dependencies]
server-core = { path = "../server-core" }
enigo = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    # SendInput, INPUT, MOUSEINPUT, MOUSEEVENTF_* — absolute pointer injection (PAD-01 D-01)
    "Win32_UI_Input_KeyboardAndMouse",
    # GetCursorPos, GetSystemMetrics, SM_*VIRTUALSCREEN — virtual-desktop metrics (D-03)
    "Win32_UI_WindowsAndMessaging",
    # ── Phase 5 (05-05) media/power executors ──
    # IMMDeviceEnumerator, MMDeviceEnumerator, eRender/eConsole (audio thread)
    "Win32_Media_Audio",
    # IAudioEndpointVolume — absolute set/read master volume (MED-02)
    "Win32_Media_Audio_Endpoints",
    # CoInitializeEx, CoCreateInstance — COM on the audio thread
    "Win32_System_Com",
    # PROPVARIANT — required by IMMDevice::Activate's signature
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # SetSuspendState — sleep (PWR-02)
    "Win32_System_Power",
    # LockWorkStation, ExitWindowsEx, EWX_*, SHTDN_REASON_* (PWR-01/03)
    "Win32_System_Shutdown",
    # OpenProcessToken, AdjustTokenPrivileges, LookupPrivilegeValueW, SE_SHUTDOWN_NAME
    "Win32_Security",
    # GetCurrentProcess, GetCurrentThreadId, OpenProcess, QueryFullProcessImageNameW,
    # PROCESS_QUERY_LIMITED_INFORMATION — token acquisition + apps-thread exe-path resolution (Flag 1)
    "Win32_System_Threading",
    # ── Phase 6 (06-02) apps thread ──
    # DwmGetWindowAttribute, DWMWA_CLOAKED — Alt-Tab cloak filter (Flag 2)
    "Win32_Graphics_Dwm",
    # GetIconInfo, GetDIBits, DeleteObject, GetDC/ReleaseDC — HICON → RGBA (Flag 2)
    "Win32_Graphics_Gdi",
    # ShellExecuteW (launch), SHGetFileInfoW (icon-by-path) (Flag 2 / APPS-02)
    "Win32_UI_Shell",
    # FILE_FLAGS_AND_ATTRIBUTES — SHGetFileInfoW's dwFileAttributes param type (Flag 2)
    "Win32_Storage_FileSystem",
    # ── Phase 6 (06-04) clip thread ──
    # RegisterClipboardFormatW, IsClipboardFormatAvailable — sensitive-clip
    # exclusion-format presence check (Flag 3 / CLIP-03)
    "Win32_System_DataExchange",
    # ── Phase 7 (07-03) firewall self-test ──
    # INetFwPolicy2, NetFwPolicy2, INetFwRules/INetFwRule, NET_FW_* — READ-ONLY
    # inbound-allowed query on the active profile (SRV-04, ASVS V4; never
    # Add/Set/Remove). Win32_System_Com (CoCreateInstance) already present.
    "Win32_NetworkManagement_WindowsFirewall",
    # IEnumVARIANT (rule enumeration) + VARIANT (gated on Com+Ole) — walk the
    # firewall Rules collection read-only.
    "Win32_System_Ole",
] }
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tracing = "0.1"
# ── Phase 7 (07-07) persistent config ──
# config.toml serde structs (Config + [[paired]] PairedDeviceCfg) — derive
# lives here now that server-windows owns its own serde types (SRV-03/D-01).
serde = { version = "1", features = ["derive"] }
# TOML codec for %APPDATA%/RemoteControl/config.toml. Locked by CLAUDE.md;
# RESEARCH Package Legitimacy Audit verdict OK/Approved (toml-rs org).
toml = "1.1"
# Known-folder resolution: dirs::config_dir() == %APPDATA%\Roaming (RESEARCH
# A5). Locked by CLAUDE.md; audit verdict OK/Approved (dirs-dev org).
dirs = "6.0"
# Paired-hash hex codec (64 lowercase hex chars ⇄ [u8;32]) — same crate/major
# server-core already uses for the token hex (no new supply-chain surface).
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Rolling daily log files under %APPDATA%/RemoteControl/logs (quick 260729-4rg).
# Not optional convenience: the release binary is windows_subsystem="windows",
# so there is no console and the file IS the log. Locked by CLAUDE.md
# ("Spec requires file logging with level filter"); tokio-rs org, same lineage
# as tracing/tracing-subscriber already in tree.
tracing-appender = "0.2"
anyhow = "1"
# Machine GUID read (HKLM\SOFTWARE\Microsoft\Cryptography) for the beacon
# identity — Windows-only, injected into server-core (CONN-01).
winreg = "0.56"
# WinRT toast for the pairing PIN from the unpackaged exe (D-09/CONN-02);
# POWERSHELL_APP_ID needs no AUMID registration (proper AUMID: Phase 7 tray).
tauri-winrt-notification = "0.8"
# Encode extracted 32x32 window icons to compact PNG for the wire (image-rs org,
# audited T-06-SC); base64 is hand-rolled (pure fn) to keep the dep set minimal.
png = "0.18"
# Clipboard get/set on the dedicated clip thread (06-04, CLIP-01/02/03). Locked
# by CLAUDE.md; 1Password lineage, audited T-06-SC. Must stay on one OS thread.
arboard = "3.6"
# Content-hash fingerprint for clip echo suppression (D-05). Same major as
# server-core's token hashing — RustCrypto, already in tree (no new supply-chain
# surface, T-06-SC).
sha2 = "0.11"
# Autostart toggle (SRV-02): writes the HKCU ...\Run key (per-user, no admin).
# Locked by CLAUDE.md; RESEARCH Package Legitimacy Audit verdict OK/Approved
# (auto-launch 0.6.0, zzzgydi/tauri-adjacent). Absolute current_exe() app_path;
# winreg (already in tree) is the documented HKCU fallback if enable() ever
# returns access-denied (Pitfall 7 / A2).
auto-launch = "0.6"
# ── Phase 7 (07-06) tray/settings shell ──
# Tray icon + muda menu (Pause/Quit; Settings/Pair-new land in 07-08).
# tauri-apps, RESEARCH Package Legitimacy Audit verdict OK/Approved (locked).
tray-icon = "0.24"
# Event loop the tray + (07-08) settings window run on, off-main via
# with_any_thread(true). PINNED to 0.30 — 0.31 is a beta that breaks eframe/
# egui 0.35 compat (RESEARCH "Deprecated"/Package Legitimacy Audit).
winit = "0.30"
# egui-on-winit (NOT the eframe wrapper — RESEARCH Pitfall 4: eframe owns its
# own loop and cannot share the tray's). The settings window (07-08) drives
# egui_glow's EguiGlow helper on the shell thread's loop ("winit" feature).
egui = "0.35"
egui-winit = "0.35"
egui_glow = { version = "0.35", features = ["winit"] }
# GL context/surface creation for the egui_glow settings window — the exact
# pairing egui_glow 0.35 itself tests against (glutin 0.32.3 + glutin-winit
# 0.5.0 in its pure_glow example dev-deps). rust-windowing org, same lineage
# as winit; RESEARCH audit covers the egui workspace these serve.
glutin = "0.32"
glutin-winit = "0.5"
# QR code generation for the redesigned pair-device window (1c): the pairing
# payload rendered as egui rects. Pure-Rust, no default image feature (we paint
# the module matrix ourselves).
qrcode = { version = "0.14", default-features = false }
# ── Phase 12 (12-06) in-app updates ──
# Blocking HTTP client for the release feed + asset download. BLOCKING BY
# DESIGN: the work belongs on a dedicated OS thread beside apps_thread /
# clip_thread / audio_thread, never on a tokio worker (a 5 MB download would
# stall one for its whole duration). `reqwest`'s blocking mode spins a SECOND
# private tokio runtime inside a process that already owns one — bigger tree,
# no benefit, for one request a day. Default features are rustls + the bundled
# webpki-roots, so there is no OpenSSL and no Windows cert-store plumbing.
# RESEARCH Package Legitimacy Audit verdict OK/Approved (algesten/ureq, first
# published 2018, 169M downloads); 3.3.0 re-verified with `cargo search ureq`
# at execution time. NOTE: every ureq timeout defaults to None — see
# update::feed::feed_agent (RESEARCH Pitfall 1).
ureq = "3.3"
# JSON codec for the releases/latest feed body (update::feed::parse_release).
# NOT new supply-chain surface: serde_json 1 is already in the tree via
# server-core; this only declares the direct dependency server-windows needs
# now that it parses a JSON body of its own. serde (derive) was already here.
serde_json = "1"

[build-dependencies]
# Embeds assets/icon/icon.ico + VERSIONINFO into the exe (build.rs, quick
# 260716-ns1). Maintained fork of winres (BenjaminRi/winresource); verified
# on crates.io at execution time (0.1.31, repo matches, not yanked).
# Build-time only — zero runtime surface.
winresource = "0.1"
