[package]
name = "server-windows"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Windows composition root for Remote Control: enigo input injection, DPI awareness, tracing subscriber, ServerDeps assembly around server-core."

[dependencies]
server-core = { path = "../server-core" }
enigo = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    # SendInput, INPUT, MOUSEINPUT, MOUSEEVENTF_* — absolute pointer injection (PAD-01 D-01)
    "Win32_UI_Input_KeyboardAndMouse",
    # GetCursorPos, GetSystemMetrics, SM_*VIRTUALSCREEN — virtual-desktop metrics (D-03)
    "Win32_UI_WindowsAndMessaging",
    # ── Phase 5 (05-05) media/power executors ──
    # IMMDeviceEnumerator, MMDeviceEnumerator, eRender/eConsole (audio thread)
    "Win32_Media_Audio",
    # IAudioEndpointVolume — absolute set/read master volume (MED-02)
    "Win32_Media_Audio_Endpoints",
    # CoInitializeEx, CoCreateInstance — COM on the audio thread
    "Win32_System_Com",
    # PROPVARIANT — required by IMMDevice::Activate's signature
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # SetSuspendState — sleep (PWR-02)
    "Win32_System_Power",
    # LockWorkStation, ExitWindowsEx, EWX_*, SHTDN_REASON_* (PWR-01/03)
    "Win32_System_Shutdown",
    # OpenProcessToken, AdjustTokenPrivileges, LookupPrivilegeValueW, SE_SHUTDOWN_NAME
    "Win32_Security",
    # GetCurrentProcess, GetCurrentThreadId, OpenProcess, QueryFullProcessImageNameW,
    # PROCESS_QUERY_LIMITED_INFORMATION — token acquisition + apps-thread exe-path resolution (Flag 1)
    "Win32_System_Threading",
    # ── Phase 6 (06-02) apps thread ──
    # DwmGetWindowAttribute, DWMWA_CLOAKED — Alt-Tab cloak filter (Flag 2)
    "Win32_Graphics_Dwm",
    # GetIconInfo, GetDIBits, DeleteObject, GetDC/ReleaseDC — HICON → RGBA (Flag 2)
    "Win32_Graphics_Gdi",
    # ShellExecuteW (launch), SHGetFileInfoW (icon-by-path) (Flag 2 / APPS-02)
    "Win32_UI_Shell",
] }
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# Machine GUID read (HKLM\SOFTWARE\Microsoft\Cryptography) for the beacon
# identity — Windows-only, injected into server-core (CONN-01).
winreg = "0.56"
# WinRT toast for the pairing PIN from the unpackaged exe (D-09/CONN-02);
# POWERSHELL_APP_ID needs no AUMID registration (proper AUMID: Phase 7 tray).
tauri-winrt-notification = "0.8"
# Encode extracted 32x32 window icons to compact PNG for the wire (image-rs org,
# audited T-06-SC); base64 is hand-rolled (pure fn) to keep the dep set minimal.
png = "0.18"
