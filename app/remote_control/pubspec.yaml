name: remote_control
description: "Remote Control Android client: wireless mouse, keyboard, and control center for a Windows laptop."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# The build number (after the +) is Android's versionCode and must only ever
# INCREASE -- Android refuses to install a lower code over a higher one. It sat
# at 1 through the v1.0.0, v1.1.0, v1.2.0, and v1.3.0-rc1 releases, so every
# one of those APKs reported itself as 1.0.0; it has been bumped per release
# since (quick 260729-42w). Bump both halves on every release.
version: 1.5.0+9

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # 09-09 gap-closure icon migration: the design prototype renders Material
  # Symbols Rounded (opsz 24 / wght 400 / FILL 0 / GRAD 0). The owner overrode
  # the 09-UI-SPEC line-28 skew acceptance on 2026-07-16 — full glyph-style
  # fidelity wanted. Const IconData only (tree-shakeable); never use get().
  material_symbols_icons: ^4.2951.0
  flutter_riverpod: ^3.3.2
  web_socket_channel: ^3.0.3
  wakelock_plus: ^1.6.1
  # Per-device auth token at rest (D-10, spec-locked). v10 default cipher
  # (RSA_ECB_OAEP+SHA-256) — NEVER set the deprecated encryptedSharedPreferences.
  flutter_secure_storage: ^10.3.1
  # Non-secret device metadata only (D-07): names, last-known ip:port,
  # last-connected pointer. Secrets NEVER go here (stack rule).
  shared_preferences: ^2.5.5
  # Wire-protocol codecs (binary mouse frames + JSON messages), fixture-proven
  # byte-identical to the Rust decoder. NEVER re-implement a codec app-side.
  remote_protocol:
    path: ../packages/remote_protocol
  # QR pairing scanner — the maintained package (the old qr_code_scanner is
  # deprecated); user-locked (260716-kba), verified publisher steenbakker.dev.
  mobile_scanner: ^7.2.1
  # Reads versionName/versionCode back out of the INSTALLED package for the
  # Settings > About row (260729-42w). Deliberately not a hand-maintained Dart
  # constant: the whole bug being fixed is a version string drifting away from
  # what actually shipped. fluttercommunity "plus" family, same vendor as
  # wakelock_plus; no new permission, no runtime surface beyond one platform
  # call.
  package_info_plus: ^10.2.1
  # sha256 of the downloaded APK before it is ever handed to the installer
  # (D-15/SC4). Dart has no built-in digest. `dart.dev` verified publisher,
  # 160/160 pub points, source dart-lang/core, pure Dart with no platform
  # channel and no native code; 3.0.7 re-checked against the pub.dev API at
  # execution time (still latest, published 2025-11-04). The reason it is THIS
  # package and not a wrapper: `Hash.startChunkedConversion` hashes a ~70 MB
  # APK without ever holding a second copy in memory. This is the phase's ONLY
  # new dependency -- the cache directory comes from the existing
  # remote_control/installer channel, not path_provider, and the HTTP work uses
  # dart:io HttpClient, not package:http.
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Already resolved transitively via shared_preferences (same vendor/repo);
  # declared explicitly ONLY so widget tests can construct
  # InMemorySharedPreferencesAsync — no new package, no version change.
  shared_preferences_platform_interface: ^2.4.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
